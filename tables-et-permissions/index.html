<html>

<head>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <script src="api.js"></script>
  <style id="stylejta">
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }

    table,
    th,
    td {
      border: 1px solid black;
    }

    th {
      background-color: #f2f2f2;
    }

    th,
    td {
      padding: 4px;
      text-align: left;
      vertical-align: top;
      font-size: 14px;
      font-family: Arial, Helvetica, sans-serif;
    }

    pre {
      background-color: #f4f4f4;
      padding: 8px;
      margin: 0px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .titre {
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div style="font-family: sans-serif; padding-left: 1em;padding-right: 1em;">
    <h2>Tables et permissions</h2>
    <p>Ce plugin permet de générer un rapport complet sur les tables et les permissions avancées du document<br>
      Ce rapport est téléchargeable au format HTML (bouton "Enregistrer" en bas du tableau)</p>
    <i><b>NB</b> : Il faut un accès complet au document</i>
    <br> <br>
    <button id="tables">Les tables</button>&nbsp;
    <button id="acl">Les ACL</button>
    <br><hr><br>
    <div id="container"></div>
    <div id="bouton"></div>
  </div>
</body>

</html>
