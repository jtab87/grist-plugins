<html>

<head>
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    <script src="api.js"></script>
    <style>
        #error-message {
            color: red;
            display: none;
            font-size: 12px;
            padding-top: 5px;
        }

        #bouton {
            display: none;
        }

        #dump {
            padding-top: 12px
        }
    </style>
</head>

<body>
    <div style="font-family: sans-serif; padding: 1em;">
        <h2 id="titre">tirage aléatoire</h2>

        <label for="nbtirage">Entrez un nombre ou pourcentage (ex: 50 ou 50%) :</label>
        <input type="text" id="nbtirage" name="nbtirage" pattern="^[0-9]+%?$">
        <span id="error-message"></span>
        <button id="bouton" onclick="run()">Envoyer</button>

        <div id="dump"></div>
    </div>
</body>

</html>
